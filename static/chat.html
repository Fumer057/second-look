<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>Second Look - Chat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    body, main { height: 100vh; margin: 0; display: flex; flex-direction: column; max-width: 100%; padding: 0; background: #fff; }
    header { padding: 12px 16px; background: var(--bg); border-bottom: 1px solid #eee; text-align: left; display: flex; justify-content: space-between; align-items: center; margin: 0; }
    h1 { font-size: 1.2rem; margin: 0; }
    .chat-area { flex: 1; overflow-y: auto; padding: 16px; background: #efeae2; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 1rem; position: relative; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: #d9fdd3; border-top-right-radius: 4px; }
    .msg.bot { align-self: flex-start; background: #fff; border-top-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .msg.bot.scam { border-left: 4px solid var(--scam); }
    .msg.bot.suspicious { border-left: 4px solid var(--sus); }
    .msg.bot.safe { border-left: 4px solid var(--safe); }
    .msg img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; }
    
    .bot-title { font-weight: bold; margin-bottom: 6px; font-size: 1.1rem; }
    .bot-section { margin-top: 8px; font-size: 0.95rem; }
    .bot-section strong { display: block; margin-bottom: 2px; }
    .bot-section ul, .bot-section ol { margin: 0; padding-left: 20px; }
    
    .input-area { background: #f0f2f5; padding: 10px 16px; display: flex; gap: 8px; align-items: flex-end; }
    .upload-btn { background: none; border: none; font-size: 1.5rem; padding: 8px; cursor: pointer; color: var(--muted); }
    .text-input { flex: 1; border: 1px solid #fff; border-radius: 20px; padding: 10px 16px; font-family: inherit; font-size: 1rem; resize: none; max-height: 120px; outline: none; background: #fff; }
    .text-input:focus { border-color: var(--brand); }
    .send-btn { background: var(--brand); color: #fff; border: none; border-radius: 50%; width: 44px; height: 44px; display: flex; justify-content: center; align-items: center; cursor: pointer; padding: 0; }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    #file-input { display: none; }
    .preview-container { display: none; background: #f0f2f5; padding: 10px 16px 0; }
    .preview-img { max-height: 100px; border-radius: 8px; }
    .clear-preview { position: absolute; background: rgba(0,0,0,0.5); color: white; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; top: 15px; left: 20px; }
    
    .typing { display: flex; gap: 4px; align-items: center; padding: 14px !important; }
    .typing-dot { width: 6px; height: 6px; background: #888; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>🛡️ Second Look Chat</h1>
      <select id="language" style="padding: 4px; font-size: 0.9rem; border-radius: 6px;">
          <option>English</option>
          <option value="Hindi">हिन्दी</option>
          <option value="Tamil">தமிழ்</option>
          <option value="Bengali">বাংলা</option>
          <option value="Marathi">मराठी</option>
          <option value="Telugu">తెలుగు</option>
      </select>
    </header>

    <div class="chat-area" id="chat">
      <div class="msg bot">
        Hello! I'm Second Look. Paste a suspicious message or upload a screenshot, and I'll help you figure out if it's a scam.<br><br>
        You can also ask me questions like <i>"I clicked the link, what do I do?"</i>
      </div>
    </div>
    
    <div class="preview-container" id="preview-box">
      <div style="position: relative; display: inline-block;">
        <img id="preview" class="preview-img" src="" alt="preview">
        <button class="clear-preview" id="clear-img">✕</button>
      </div>
    </div>

    <div class="input-area">
      <input type="file" id="file-input" accept="image/*">
      <button class="upload-btn" id="upload-btn" title="Add screenshot">📎</button>
      <textarea class="text-input" id="input-text" rows="1" placeholder="Message..."></textarea>
      <button class="send-btn" id="send-btn">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
      </button>
    </div>
  </main>
  <script src="/static/chat.js"></script>
</body>
</html>
